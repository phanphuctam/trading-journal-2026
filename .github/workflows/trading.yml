name: Trading bot

on:
  schedule:
    - cron: '0 2 * * 6'          # 09:00 sang thu Bay VN — so lieu watchlist + check watchlist
    - cron: '*/30 2-8 * * 1-5'   # phien HOSE (09:00-15:00 VN = 02:00-08:00 UTC); script tu bo qua ngoai gio
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # vnstock ban mien phi gioi han 20 request/phut
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cai thu vien
        run: pip install --quiet tradingview-screener requests pandas vnstock pyarrow

      # Cache OHLCV: lan dau tai ~400 ma (~25 phut), cac lan sau chi cap nhat duoi
      - name: Cache du lieu gia VN
        uses: actions/cache@v4
        with:
          path: automation/.vncache
          key: vncache-${{ github.run_id }}
          restore-keys: vncache-

      # Mot request, chay moi lan — journal dung lam ty gia mac dinh khi ghi lenh moi
      - name: Cap nhat ty gia USD/VND
        continue-on-error: true
        run: python automation/fetch_fx.py

      # Cong tac tong: chi 1 request (VN-Index) nen chay ca trong phien, khong doi
      # den thu Bay. Cong chan lenh trong journal doc file nay, no phai luon tuoi.
      - name: Cong tac tong VN-Index (trong phien)
        if: github.event.schedule == '*/30 2-8 * * 1-5'
        continue-on-error: true
        run: python automation/regime.py

      - name: So lieu watchlist + check watchlist (9h sang thu Bay VN)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 6'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automation/regime.py --telegram
          python automation/watch_stats.py
          python automation/fund_vn.py
          python automation/alert_watcher.py --force --market vn

      - name: Check watchlist trong phien HOSE
        if: github.event.schedule == '*/30 2-8 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/alert_watcher.py --market vn

      - name: Commit ket qua (regime + so lieu watchlist + co ban + state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fund_hist.json PHAI duoc commit: vnstock ban cong dong chi tra 4 ky gan nhat,
          # file nay la noi tich luy dan de sau ~4 quy tu so duoc quy voi cung ky nam truoc.
          # Mat file = mat toan bo lich su, bat dau lai tu dau.
          # Chi add file CO THAT: lan chay trong phien khong sinh fund_*.json, ma `git add`
          # mot duong dan khong ton tai se lam hong ca buoc commit.
          for f in scans/regime_vn.json scans/watch_stats.json scans/fx.json \
                   scans/fund_vn.json scans/fund_hist.json automation/state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || { git commit -m "bot: regime VN/state $(date -u '+%Y-%m-%d %H:%M') UTC"; git push; }

# Bo loc VCP tu dong da bo (2026-08-07): viec chon co phieu chuyen sang loc bang mat
# tren TradingView. Con lai o day la thu TradingView khong lam duoc — cong tac tong
# (regime.py), tran vi the + co ⚑ doi lai (watch_stats.py), va canh bao nhieu ma cung
# luc qua Telegram (alert_watcher.py, ban free cua TradingView gioi han so alert).
#
# Bo loc My tam gac (mo lai khi phap ly cho phep giao dich lai):
#   - cron thu Bay: chay lai scan_trend_template.py --no-push, dat CHART_LAYOUT_ID: zg2TshOU
#   - them lai cron phien My '*/30 13-21 * * 1-5' voi alert_watcher --market us
#   - commit them scans/latest.json
#   - trong app-src.html: doi SCAN_MARKETS ve ['VN','US'] de hien lai nut chuyen thi truong
