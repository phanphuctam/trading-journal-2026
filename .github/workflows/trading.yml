name: Trading bot

on:
  schedule:
    - cron: '0 2 * * 6'          # 09:00 sang thu Bay VN — scan VCP Viet Nam + check watchlist
    - cron: '*/30 2-8 * * 1-5'   # phien HOSE (09:00-15:00 VN = 02:00-08:00 UTC); script tu bo qua ngoai gio
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # vnstock ban mien phi gioi han 20 request/phut
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cai thu vien
        run: pip install --quiet tradingview-screener requests pandas vnstock pyarrow

      # Cache OHLCV: lan dau tai ~400 ma (~25 phut), cac lan sau chi cap nhat duoi
      - name: Cache du lieu gia VN
        uses: actions/cache@v4
        with:
          path: automation/.vncache
          key: vncache-${{ github.run_id }}
          restore-keys: vncache-

      # Mot request, chay moi lan — journal dung lam ty gia mac dinh khi ghi lenh moi
      - name: Cap nhat ty gia USD/VND
        continue-on-error: true
        run: python automation/fetch_fx.py

      - name: Scan VCP Viet Nam + check watchlist (9h sang thu Bay VN)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 6'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automation/scan_vn_vcp.py --refresh-liquid --telegram
          python automation/alert_watcher.py --force --market vn

      - name: Check watchlist trong phien HOSE
        if: github.event.schedule == '*/30 2-8 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/alert_watcher.py --market vn

      - name: Commit ket qua (scan + state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scans/latest_vn.json scans/fx.json automation/state.json
          git diff --cached --quiet || { git commit -m "bot: scan VN/state $(date -u '+%Y-%m-%d %H:%M') UTC"; git push; }

# Bo loc My tam gac (mo lai khi phap ly cho phep giao dich lai):
