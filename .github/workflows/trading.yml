name: Trading bot

# ══ AI CHAY LUC NAO, VA VI SAO ══
# Tu 2026-08-12 journal doc thang scanner.tradingview.com trong trinh duyet (1 request,
# tra san SMA50/SMA200, tre ~15 phut). Nen CONG TAC TONG khong con can bot nua — bot chi
# con lam nhung thu trinh duyet KHONG lam duoc:
#
#   · alert_watcher.py  — bao Telegram luc minh khong ngoi truoc man hinh. Day moi la
#                         thu dang chay 30 phut/lan.
#   · regime.py         — NGAY PHAN PHOI + FTD, can chuoi lich su nen endpoint mot-diem
#                         cua TradingView khong tra duoc. Chay 1 lan/ngay SAU DONG CUA:
#                         dem ngay phan phoi tren mot cay nen chua dong la dem sai.
#   · watch_stats.py    — tran vi the + co doi lai, can 60 phien lich su.
#   · fund_vn.py        — BCTC, khong co nguon nao khac.
#   · profile_vn.py     — room ngoai, lich su kien (GDKHQ!), phat hanh them chua thuc
#                         hien, giao dich noi bo, quet tin. Khong nguon nao khac.
#   · fetch_fx.py       — ty gia, 1 request. Ngay 1 lan la du, khong can 13 lan.

on:
  schedule:
    - cron: '*/30 2-8 * * 1-5'   # phien HOSE (09:00-15:00 VN) — CHI canh bao Telegram
    - cron: '0 8 * * 1-5'        # 15:00 VN, sau ATC — ngay phan phoi/FTD + ty gia
    - cron: '0 2 * * 6'          # 09:00 sang thu Bay VN — so lieu watchlist + co ban

  # Bam tay tu journal (nut "Chay bot" / "Cham bang may"). Can vi cron cua GitHub ban
  # mien phi bi tri hoan 1-1,5 tieng va bo bot lan chay — do 12/08/2026: lich 13 lan/ngay
  # nhung thuc te 5-6 lan, co ngay khong lan nao.
  workflow_dispatch:
    inputs:
      mode:
        description: 'regime = ngay phan phoi/FTD (~1 phut) | full = them so lieu watchlist + co ban (~10-30 phut)'
        type: choice
        options: [regime, full]
        default: regime

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # VNSTOCK_API_KEY la KHOA TOC DO, khong phai khoa mo them du lieu. vnstock chan
    # toc do phia client theo tier (vnai/beam/auth.py): khong key = 'guest' 20 req/phut,
    # co key MIEN PHI = 'free' 60 req/phut. Cac script tu doc tier nen dat secret nay
    # vao la lan chay ngan lai ~3 lan, khong phai sua code.
    # Chua dat secret thi van chay binh thuong o muc guest — bien rong se rong.
    # Lay key: dang nhap vnstocks.com/account#api-key
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cai thu vien
        run: pip install --quiet tradingview-screener requests pandas vnstock pyarrow

      # Cache OHLCV: lan dau tai ~400 ma (~25 phut), cac lan sau chi cap nhat duoi
      - name: Cache du lieu gia VN
        uses: actions/cache@v4
        with:
          path: automation/.vncache
          key: vncache-${{ github.run_id }}
          restore-keys: vncache-

      # ── TRONG PHIEN: chi canh bao Telegram ──
      # Truoc day buoc nay con chay regime.py 30 phut/lan. Bo di vi journal da doc
      # thang TradingView — chay lai chi de ghi de mot con so tuong duong, va con
      # sinh commit rac moi nua tieng.
      - name: Canh bao watchlist qua Telegram (trong phien HOSE)
        if: github.event.schedule == '*/30 2-8 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/alert_watcher.py --market vn

      # ── SAU DONG CUA: nhung thu can nen DA DONG ──
      - name: Ngay phan phoi + FTD + ty gia (sau ATC)
        if: github.event.schedule == '0 8 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'full')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automation/fetch_fx.py
          python automation/regime.py --telegram

      # ── THU BAY (hoac bam "Cham bang may"): so lieu nang ──
      - name: So lieu watchlist + co ban
        if: github.event.schedule == '0 2 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automation/fetch_fx.py
          python automation/regime.py --telegram
          python automation/watch_stats.py
          python automation/fund_vn.py
          python automation/profile_vn.py
          python automation/alert_watcher.py --force --market vn

      # ── COMMIT ──
      # Run #127 (12/08/2026) that bai o dung day: `git push` bi tu choi vi remote da
      # di truoc mot commit trong luc bot chay. Moi viec tinh toan deu xong xuoi, chi
      # buoc day len la hong — nhung ca lan chay bi danh dau "failure".
      #
      # Cach sua: KHONG rebase (dinh conflict tren chinh file bot vua ghi). Thay vao do
      # dua HEAD ve dung ban moi nhat cua remote bang `reset --mixed` — file bot vua sinh
      # van nam nguyen tren dia — roi commit chung len tren. Bot luon thang o cac file
      # nay vi no la nguoi duy nhat sinh ra chung.
      - name: Commit ket qua
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fund_hist.json PHAI duoc commit: vnstock ban cong dong chi tra 4 ky gan nhat,
          # file nay la noi tich luy dan de sau ~4 quy tu so duoc quy voi cung ky nam truoc.
          # Mat file = mat toan bo lich su, bat dau lai tu dau.
          FILES="scans/regime_vn.json scans/watch_stats.json scans/fx.json \
                 scans/fund_vn.json scans/fund_hist.json scans/profile_vn.json \
                 automation/state.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --mixed FETCH_HEAD
            # Chi add file CO THAT: lan chay trong phien khong sinh fund_*.json, ma
            # `git add` mot duong dan khong ton tai se lam hong ca buoc nay.
            # Phai dung `if` chu khong `[ -f x ] && git add x`: voi `set -e`, mot phep
            # test that bai o cuoi vong lap se giet ca script.
            for f in $FILES; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            if git diff --cached --quiet; then
              echo "Khong co so lieu nao doi — khong commit."
              exit 0
            fi
            git commit -q -m "bot: regime VN/state $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Da day len sau $i lan thu."
              exit 0
            fi
            echo "Push bi tu choi (remote di truoc) — thu lai lan $((i + 1))…"
            sleep $((i * 5))
          done
          echo "::error::Khong day duoc ket qua len sau 5 lan thu."
          exit 1

# Bo loc VCP tu dong da bo (2026-08-07): viec chon co phieu chuyen sang loc bang mat
# tren TradingView. Con lai o day la thu TradingView (hoac trinh duyet) khong lam duoc.
#
# Bo loc My tam gac (mo lai khi phap ly cho phep giao dich lai):
#   - cron thu Bay: chay lai scan_trend_template.py --no-push, dat CHART_LAYOUT_ID: zg2TshOU
#   - them lai cron phien My '*/30 13-21 * * 1-5' voi alert_watcher --market us
#   - commit them scans/latest.json
#   - trong app-src.html: doi SCAN_MARKETS ve ['VN','US'] de hien lai nut chuyen thi truong
